<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="t d">
<title id="t">Field Notes UML component architecture</title><desc id="d">Browser UI calls API controllers, services and repositories, which persist to PostgreSQL. Services and repositories depend on domain interfaces.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#151515"/></marker></defs>
<rect width="1100" height="610" fill="#F1EDE5"/>
<g font-family="Arial,sans-serif" fill="#151515"><text x="35" y="45" font-size="27" font-weight="bold">Field Notes / UML component architecture</text>
<g fill="none" stroke="#77736F"><rect x="30" y="85" width="300" height="465"/><rect x="370" y="85" width="430" height="465"/><rect x="840" y="85" width="230" height="465"/></g>
<g font-size="17"><text x="48" y="115">«node» Vercel / browser</text><text x="390" y="115">«node» Railway / Go</text><text x="855" y="115">«database» PostgreSQL</text></g>
<g fill="#fff" stroke="#151515"><rect x="50" y="160" width="260" height="100"/><rect x="50" y="330" width="260" height="100"/><rect x="390" y="160" width="245" height="80"/><rect x="390" y="300" width="245" height="80"/><rect x="390" y="440" width="245" height="80"/><rect x="665" y="300" width="115" height="80"/><rect x="855" y="440" width="200" height="80"/></g>
<g font-size="16"><text x="65" y="188">«component» Prototype UI</text><text x="65" y="218">Journal / folders / dialogs</text><text x="65" y="246">Accessible enhancement layer</text><text x="65" y="358">«component» TypeScript</text><text x="65" y="388">Consent / sync / JWT memory</text><text x="65" y="416">API bridge</text><text x="406" y="189">«component» Controllers</text><text x="406" y="220">HTTP / CORS / rate limits</text><text x="406" y="329">«component» Services</text><text x="406" y="360">Rules / JWT / passwords / roles</text><text x="406" y="469">«component» Repositories</text><text x="406" y="500">SQL / migrations / transactions</text><text x="675" y="329">«interface»</text><text x="688" y="360">Domain</text><text x="868" y="470">Records / accounts</text><text x="868" y="500">Invitations / audit</text></g>
<g fill="none" stroke="#151515" stroke-width="2" marker-end="url(#a)"><path d="M180 260V330"/><path d="M310 380H350V200H390"/><path d="M510 240V300"/><path d="M510 380V440"/><path d="M635 480H855"/></g>
<g fill="none" stroke="#77736F" stroke-dasharray="5 4" marker-end="url(#a)"><path d="M635 340H665"/><path d="M635 460H720V380"/></g><text x="255" y="285" font-size="14" fill="#B12F30">HTTPS /api/v1</text><text x="760" y="470" font-size="14">SQL</text><text x="35" y="585" font-size="15">Solid arrows: calls / data access. Dashed arrows: dependencies on domain contracts. Secrets remain on the server.</text></g></svg>
